[workspace]
resolver = "2"
members = [
    "crates/se-protocol",
    "crates/se-provider",
    "crates/se-command",
    "crates/se-permission",
    "crates/se-catalogue",
    "crates/se-core",
    "crates/se-tui",
    "crates/se",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

# Pinned centrally so the crates cannot drift to different versions of
# the same dependency, which is how two halves of one workspace end up
# disagreeing about a type.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
# Blocking HTTP on purpose: the providers SE talks to are request/response
# and SSE, both of which a worker thread handles fine. An async runtime
# would be a dependency with no job to do (see docs/ARCHITECTURE.md).
ureq = { version = "2.12", features = ["json", "tls"] }
keyring = "3.6"

# One lint policy for every crate (each opts in with `[lints] workspace = true`).
[workspace.lints.rust]
# The only unsafe code is the Windows file-identity FFI call, allowed at
# that one site with its safety argument.
unsafe_code = "deny"

[workspace.lints.clippy]
# Panicking on input the user, a file, the network or the OS controls is a
# bug. `expect` stays allowed for invariants the code itself guarantees;
# tests may unwrap (see clippy.toml).
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
# A CLI's startup cost is part of its user experience (see the latency
# budget in docs/ARCHITECTURE.md): one codegen unit and real LTO measurably
# shrink both the binary and process start.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
