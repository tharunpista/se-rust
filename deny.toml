# cargo-deny: run in CI (`deny` job) and locally with `cargo deny check`.
# A new dependency whose licence, advisory status or source is not listed
# here fails the build, so adding one is a reviewed decision.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported but do not fail the build on their own;
# a security advisory always does.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Every licence currently in the tree is permissive and compatible with
# shipping SE under Apache-2.0. Anything else needs a decision first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots ships the Mozilla root list under this licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates refer to each other by path; that is not a wildcard
# from crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
