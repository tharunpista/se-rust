[package]
name = "se-provider"
# Not on crates.io; SE ships as a binary.
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model providers: the trait, OS-native credential storage, and streaming adapters."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }

[lints]
workspace = true
