[package]
name = "se"
# Not on crates.io; SE ships as a binary.
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `se` binary: wiring and terminal lifecycle."

[[bin]]
name = "se"
path = "src/main.rs"

[dependencies]
se-protocol = { path = "../se-protocol" }
se-core = { path = "../se-core" }
se-provider = { path = "../se-provider" }
se-tui = { path = "../se-tui" }
se-command = { path = "../se-command" }
se-catalogue = { path = "../se-catalogue" }
se-permission = { path = "../se-permission" }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
