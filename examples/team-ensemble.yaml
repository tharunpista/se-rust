# se team run examples/team-ensemble.yaml
# Two vendors answer the same question; an evaluator shows where they
# disagree (never picks a winner); a QA review runs last on the reserve.
max_concurrent: 3
budget_tokens: 400000
review_reserve_tokens: 50000
tasks:
  - id: plan
    agent: solution-architect
    request: Plan an orders table for the shop.
  - id: db
    deps: [plan]
    ensemble: [anthropic/claude-sonnet-4-5, openai/gpt-5]
    request: Which database fits the orders table?
  - id: review
    agent: qa-lead
    review: true
    deps: [db]
    request: Review the database decision.
